limit_req_zone $binary_remote_addr zone=prism_requests:1m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=prism_connections:1m;
server {
    listen 80;
    server_name prism.140.245.195.222.sslip.io;
    location /.well-known/acme-challenge/ { root /opt/prism-learning/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name prism.140.245.195.222.sslip.io;
    ssl_certificate /etc/letsencrypt/live/prism-learning/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prism-learning/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=2592000" always;
    access_log off;
    error_log /var/log/nginx/prism-learning-error.log warn;
    location / {
        limit_req zone=prism_requests burst=20 nodelay;
        limit_conn prism_connections 8;
        proxy_pass http://127.0.0.1:8176;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_request_buffering on;
    }
}
